name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      # Build with the production adapter wired (same-origin API via nginx proxy).
      - run: npm run build
        env:
          VITE_USE_SERVER_ADAPTER: "on"
          VITE_API_BASE_URL: ""

  backend:
    name: Backend (type-check · lint · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # The server tsconfig type-checks shared ../src files (derive.ts + the
      # household/assumptions types, imported via @planner). Those live in the
      # src/ tree, so their imports (zod, etc.) resolve against the ROOT
      # node_modules — which a server-only `npm ci` does not install. Install
      # root deps too, or the shared files collapse to `any` (noImplicitAny).
      - name: Install root deps (for ../src shared type-check)
        run: npm ci
        working-directory: .
      - run: npm run prisma:generate
      - run: npm run type-check
      # ESLint gate (server-only): no raw c.json() (envelope discipline) +
      # no console.* (pino-logger discipline) over server/src/**. See
      # .claude/rules/api-envelope-pattern.md + structured-logging.md.
      - run: npm run lint
      # No DATABASE_URL in CI → the live integration specs self-skip; the
      # diff-engine + validate-env + rate-limit units (no DB) run and gate.
      - run: npm run test:unit
        env:
          NODE_ENV: test
          # index.ts runs validateEnv() as an import side-effect (fail-fast boot
          # guard), and planner.integration.spec.ts imports index — so CI must
          # supply these or the spec crashes on load. The "placeholder" in
          # DATABASE_URL satisfies validateEnv WHILE keeping the spec's RUN_LIVE
          # gate false (it excludes /placeholder/), so the live-DB specs self-skip.
          # BETTER_AUTH_SECRET is a short dummy — validateEnv only checks presence
          # (not length), and the placeholder-secret guard only fires under
          # NODE_ENV=production. Kept under 16 chars so the repo secret-scan
          # pre-commit hook doesn't flag it as a real credential.
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          BETTER_AUTH_SECRET: "ci-test-dummy"
