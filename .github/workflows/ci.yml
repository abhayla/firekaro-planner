name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      # Build with the production adapter wired (same-origin API via nginx proxy).
      - run: npm run build
        env:
          VITE_USE_SERVER_ADAPTER: "on"
          VITE_API_BASE_URL: ""

  backend:
    name: Backend (type-check · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run type-check
      # No DATABASE_URL in CI → the live integration specs self-skip; the
      # diff-engine + validate-env + rate-limit units (no DB) run and gate.
      - run: npm run test:unit
        env:
          NODE_ENV: test
