# nginx site config for FireKaro v6 — firekaro.com
#
# Architecture: nginx serves the built SPA (static dist/) and reverse-proxies
# /api/* to the Hono backend on 127.0.0.1:3100 (PM2). Same-origin, so there is
# NO CORS and NO cross-site cookie problem in production — the SPA build sets
# VITE_API_BASE_URL="" so it calls /api on its own origin.
#
# Install:
#   sudo cp deploy/nginx/firekaro.com.conf /etc/nginx/sites-available/firekaro.com
#   sudo ln -s /etc/nginx/sites-available/firekaro.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (after DNS points here — DNS is Abhay's step):
#   sudo certbot --nginx -d firekaro.com -d www.firekaro.com
#   (certbot rewrites this file to add the 443 server block + redirect.)

server {
    listen 80;
    listen [::]:80;
    server_name firekaro.com www.firekaro.com;

    # Built SPA — `npm run build` output copied to this path on the VPS.
    root /var/www/firekaro/dist;
    index index.html;

    # Reasonable upload ceiling; backend also enforces a 1 MB JSON body limit.
    client_max_body_size 2m;

    # gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + auth → Hono backend (PM2 on :3100). Includes Better Auth /api/auth/*.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # First hop in X-Forwarded-For — the rate limiter keys on this.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health check passthrough (no SPA fallback).
    location = /api/health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # Hashed build assets — long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback — every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell (so new deploys are picked up immediately).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
