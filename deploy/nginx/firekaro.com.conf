# nginx site config for FireKaro v6 — firekaro.com
#
# Architecture: nginx serves the built SPA (static dist/) and reverse-proxies
# /api/* to the Hono backend on 127.0.0.1:3100 (PM2). Same-origin, so there is
# NO CORS and NO cross-site cookie problem in production — the SPA build sets
# VITE_API_BASE_URL="" so it calls /api on its own origin.
#
# Install:
#   sudo cp deploy/nginx/firekaro.com.conf /etc/nginx/sites-available/firekaro.com
#   sudo ln -s /etc/nginx/sites-available/firekaro.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: behind Cloudflare (Full strict). The origin uses a **Cloudflare Origin
# Certificate** (15-yr, issued via the Origin CA API for firekaro.com + *.firekaro.com),
# installed on the VPS at /etc/ssl/cloudflare/firekaro.com.{pem,key} (key is root-only,
# generated on the box; never in this repo). The 443 server block below references it.
# To re-issue: generate a CSR on the box, POST it to /client/v4/certificates with a CF
# token (Zone·SSL and Certificates·Edit). See docs/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name firekaro.com www.firekaro.com;

    # Built SPA — `npm run build` output copied to this path on the VPS.
    root /var/www/firekaro/dist;
    index index.html;

    # Reasonable upload ceiling; backend also enforces a 1 MB JSON body limit.
    client_max_body_size 2m;

    # gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + auth → Hono backend (PM2 on :3100). Includes Better Auth /api/auth/*.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # First hop in X-Forwarded-For — the rate limiter keys on this.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health check passthrough (no SPA fallback).
    location = /api/health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # Hashed build assets — long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback — every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell (so new deploys are picked up immediately).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# HTTPS — Cloudflare Origin Certificate (Full strict). Mirrors the :80 block so CF's
# edge↔origin leg is encrypted + validated against firekaro's own cert. nginx 1.24 wants
# http2 on the listen line (`listen 443 ssl http2;`) — omitted here; HTTP/2 to origin is
# not needed (the user↔edge leg is HTTP/2/3 via Cloudflare regardless).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name firekaro.com www.firekaro.com;

    ssl_certificate     /etc/ssl/cloudflare/firekaro.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/firekaro.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/firekaro/dist;
    index index.html;
    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /api/health { proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
